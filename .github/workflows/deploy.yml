name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當推送到 main 分支時觸發

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Action 推送內容到倉庫（例如更新 gh-pages 分支）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 提前採用 Node.js 24 以符合未來規範

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 升級至最新的長期支援版本 (LTS)
          cache: 'npm' # 加入快取功能以加速後續建置

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # 執行你的建置命令，Vite 預設是 'npm run build'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 指定建置後的輸出目錄，Vite 預設是 'dist'